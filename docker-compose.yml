# ChattyLAN — host on any NAS (Synology, QNAP, ...).
#
# Synology: Container Manager → Project → Add → point at this folder.
# Or CLI:   docker compose up -d
#
# Secrets (DATA_KEY, INITIAL_USER/PASSWORD) are read from a .env file next to
# this one — copy .env.example to .env and fill it in. .env is gitignored, so
# the folder can be pushed/shared without exposing them. All variables are
# optional; missing/empty = feature off.
#
# First boot without INITIAL_USER: open http://<nas-ip>:8080 and create the
# first account (registration stays open until 10 accounts exist, then closes).

services:
  chatty:
    build: .
    image: chattylan
    container_name: chattylan
    restart: unless-stopped
    ports:
      - "8080:80"          # change the left side to your preferred port
    environment:
      - MAX_USERS=10
      - SESSION_DAYS=7
      # The rest come from .env (see .env.example); empty = feature off
      - DATA_KEY=${DATA_KEY:-}
      - INITIAL_USER=${INITIAL_USER:-}
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      - ALLOW_REGISTER=${ALLOW_REGISTER:-1}
    volumes:
      - ./data:/data       # users, sessions and per-user chat data
