<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- No external resources are loaded; network access is fetch() to the user-configured server, plus same-origin /api/* calls when served by server.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' http: https:; img-src blob: data:; form-action 'self'"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2315181d'/%3E%3Cpath d='M18 14H46A8 8 0 0 1 54 22V36A8 8 0 0 1 46 44H26L16 52V44H18A8 8 0 0 1 10 36V22A8 8 0 0 1 18 14Z' fill='%234c8dff'/%3E%3Ccircle cx='22' cy='29' r='3.2' fill='%2315181d'/%3E%3Ccircle cx='32' cy='29' r='3.2' fill='%2315181d'/%3E%3Ccircle cx='42' cy='29' r='3.2' fill='%2315181d'/%3E%3C/svg%3E"/>
<title>ChattyLAN</title>
<style>
:root{
  --bg:#0e1013; --panel:#15181d; --panel2:#1b1f26; --border:#2a303b;
  --text:#e7eaf0; --muted:#98a1b3; --accent:#4c8dff; --accent2:#2f6fe0;
  --err:#ff6b6b; --ok:#3ddc84;
  --userBg:rgba(76,141,255,.16); --userBd:rgba(76,141,255,.42);
  --code:#0a0c0f; --rowAlt:rgba(255,255,255,.03);
  --errBg:#2a1518; --errBd:#7f2d36; --errTx:#ffb4bb;
  --amb:#d4a72c; --ambBd:#8a7434;
  --warnBg:#2a2415; --warnBd:#7a6420; --warnTx:#e8d48b;
  --stopBg:#7f2d36;
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f3f5f9; --panel:#ffffff; --panel2:#edf0f5; --border:#d7dce4;
    --text:#1c2027; --muted:#5c6675; --accent:#2f6fe0; --accent2:#2560c2;
    --err:#c22f3a; --ok:#1d9e58;
    --userBg:rgba(47,111,224,.12); --userBd:rgba(47,111,224,.4);
    --code:#f0f2f6; --rowAlt:rgba(0,0,0,.035);
    --errBg:#fdecec; --errBd:#e3b1b6; --errTx:#9e2530;
    --amb:#8a6d1a; --ambBd:#b09a5a;
    --warnBg:#fbf3dd; --warnBd:#d9c08a; --warnTx:#6d5514;
    --stopBg:#b3282f;
  }
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
svg.i{width:15px;height:15px;flex-shrink:0}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3a4250}
html,body{height:100%}
body{margin:0;background:radial-gradient(1100px 700px at 85% -10%,rgba(76,141,255,.07),transparent 60%) fixed,var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--border);position:relative;z-index:20;transition:box-shadow .2s ease}
header.scrolled{box-shadow:0 6px 18px rgba(0,0,0,.35)}
header .logo{font-weight:700;font-size:15px;margin-right:6px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
header .logo::before{content:"";width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8b5cf6);box-shadow:0 0 8px rgba(76,141,255,.6)}
header input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:13px}
.modelWrap{position:relative}
#model{width:200px}
.modelDrop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:50;min-width:100%;width:max-content;max-width:420px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px;max-height:260px;overflow-y:auto}
.modelDrop.open{display:block}
.modelOpt{padding:6px 10px;border-radius:5px;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modelOpt:hover,.modelOpt.hl{background:var(--panel)}
.modelOpt.sel{color:var(--accent)}
.modelOpt.dim{color:var(--muted);cursor:default}
#settingsBtn{margin-left:8px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center}
#settingsBtn:hover{color:var(--text);border-color:var(--accent)}
#navToggle{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;align-items:center}
#navToggle:hover{color:var(--text);border-color:var(--accent)}
#settingsPanel{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);align-items:flex-start;justify-content:center;padding:70px 16px 16px}
#settingsPanel.open{display:flex}
.settingsCard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:460px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.settingsHead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px}
#settingsClose{background:none;border:none;color:var(--muted);cursor:pointer;padding:3px;border-radius:5px;display:inline-flex}
#settingsClose:hover{color:var(--text)}
#settingsPanel label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
#settingsPanel input{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px;font-size:13px;width:100%}
#settingsPanel input:focus{outline:none;border-color:var(--accent)}
#rightSide{margin-left:auto;display:flex;align-items:center;gap:8px}
#usersBox{display:none;position:relative;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:12.5px;color:var(--text)}
#usersBtn{background:none;border:none;color:var(--text);cursor:pointer;font-size:12.5px;line-height:inherit;padding:0;display:flex;align-items:center;gap:6px}
#usersBtn:hover{color:var(--accent)}
#userChip{display:none;position:relative;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:0;font-size:12.5px;color:var(--text)}
#userBtn{background:none;border:none;color:var(--text);cursor:pointer;font-size:12.5px;line-height:inherit;padding:4px 8px 4px 10px;display:flex;align-items:center;gap:6px;border-radius:6px}
#userBtn:hover{color:var(--accent)}
#userDrop{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;background:var(--panel2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:4px;min-width:170px}
#userDrop.open{display:block}
#userDrop .dropItem{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--text);cursor:pointer;font-size:12.5px;line-height:inherit;padding:7px 10px;border-radius:5px;text-align:left}
#userDrop .dropItem:hover{background:var(--panel)}
#userDrop .dropItem.danger:hover{color:var(--err)}
#usersDrop{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:50;background:var(--panel2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.45);padding:8px;min-width:280px}
#usersDrop.open{display:block}
#usersDrop table{border-collapse:collapse;width:100%}
#usersDrop th,#usersDrop td{text-align:left;font-size:12.5px;padding:4px 8px;color:var(--text);white-space:nowrap}
#usersDrop th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
#usersDrop tr:not(:last-child) td{border-bottom:1px solid var(--border)}
#status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;padding:2px 4px;border-radius:6px;user-select:none}
#status:hover{color:var(--text)}
/* the traffic light is always visible; the (sometimes long) status text only on demand,
   so it can never stretch the header on narrow screens */
#statusText{display:none}
#status.showText #statusText{display:inline}
#status .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
#status.ok .dot{background:var(--ok)}
#status.err .dot{background:var(--err)}
#status.busy .dot{background:var(--accent);animation:busyPulse 1.3s ease-out infinite}
@keyframes busyPulse{0%{box-shadow:0 0 0 0 rgba(76,141,255,.55)}70%{box-shadow:0 0 0 6px rgba(76,141,255,0)}100%{box-shadow:0 0 0 0 rgba(76,141,255,0)}}
#main{flex:1;display:flex;min-height:0}
#sidebar{width:230px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
body.nav-closed #sidebar{width:0;border-right:none}
#newChat,#importBtn{margin:0 10px;padding:7px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:7px;transition:border-color .15s ease,background .15s ease}
#newChat{margin-top:10px}
#importBtn{margin-bottom:10px}
#newChat:hover,#importBtn:hover{border-color:var(--accent)}
#chatList{flex:1;overflow-y:auto;padding:0 6px 10px}
.chatGroup{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--muted);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;padding:9px 10px 4px}
.chatItem{position:relative;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center;margin-bottom:2px;transition:background .15s ease,color .15s ease}
.chatItem:hover{background:var(--panel2)}
.chatItem.active{background:var(--panel2);color:var(--text)}
.chatItem.active::before{content:"";position:absolute;left:2px;top:26%;bottom:26%;width:3px;border-radius:2px;background:var(--accent)}
.chatItem .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chatItem .icon{display:none;align-items:center;color:var(--muted);font-size:13px;padding:0 4px;border-radius:4px}
.chatItem.active .icon{display:inline-flex}
.chatItem .icon svg{width:13px;height:13px}
.chatItem .icon.renIco:hover{color:var(--accent)}
.chatItem .icon.saveIco:hover{color:var(--ok)}
.chatItem .icon.mdIco{font-size:10px;font-weight:700}
.chatItem .icon.mdIco:hover{color:var(--accent)}
.chatItem .icon.del:hover{color:var(--err)}
.renameInput{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);color:var(--text);border-radius:4px;padding:2px 6px;font-size:13px}
#chatPane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#messages{flex:1;overflow-y:auto;padding:20px 0}
.inner{max-width:900px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:msgIn .18s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.avatar svg{width:16px;height:16px}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),#8b5cf6);border:none;color:#fff}
.mbody{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:calc(100% - 40px);position:relative}
.msg.user .mbody{align-items:flex-end}
.micons{display:flex;gap:4px;opacity:0;flex-shrink:0;transition:opacity .12s ease}
.msg:hover .micons{opacity:1}
.micons.pinned{opacity:1}
.micon{font-size:12px;line-height:1;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 8px;cursor:pointer;display:inline-flex;align-items:center;transition:color .15s ease,border-color .15s ease}
.micon:hover{color:var(--text);border-color:var(--accent)}
.micon.done{color:var(--ok);border-color:var(--ok)}
.micon svg{width:13px;height:13px}
/* label + action icons share one row (label on the outer edge, icons on the inner
   edge), so the icons can never sit on top of the bubble text */
.mhead{display:flex;align-items:center;gap:8px;min-height:22px}
.msg.user .mhead{flex-direction:row-reverse}
.msg .who{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:0 2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.user .bubble{background:var(--userBg);border:1px solid var(--userBd);border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.6}
.msg.assistant .bubble{background:none;border:none;border-radius:0;padding:2px 2px 2px 0;word-wrap:break-word;font-size:15px;line-height:1.6}
.msg.assistant .bubble.err{background:var(--errBg);border:1px solid var(--errBd);border-radius:12px;padding:10px 14px;color:var(--errTx);white-space:pre-wrap}
.errNote{font-size:12.5px;color:var(--errTx);background:var(--errBg);border:1px solid var(--errBd);border-radius:6px;padding:5px 9px;white-space:pre-wrap}
.bubble.typing::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-left:6px;box-shadow:9px 0 0 var(--muted),18px 0 0 var(--muted);animation:typingPulse 1s ease-in-out infinite}
@keyframes typingPulse{0%,100%{opacity:.25}50%{opacity:1}}
.bubble.stream::after{content:"";display:inline-block;width:7px;height:1.05em;margin-left:2px;border-radius:1px;background:var(--accent);vertical-align:text-bottom;animation:caretBlink 1.1s steps(2,start) infinite}
@keyframes caretBlink{0%,100%{opacity:1}50%{opacity:0}}
.bubble p:first-child{margin-top:0}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:.7em 0 .35em;line-height:1.3;font-weight:700}
.bubble h1{font-size:1.3em}.bubble h2{font-size:1.18em}.bubble h3{font-size:1.08em}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.5em}
.bubble li{margin:.18em 0}
.bubble hr{border:none;border-top:1px solid var(--border);margin:.9em 0}
.bubble blockquote{border-left:3px solid var(--border);margin:.5em 0;padding:2px 10px;color:var(--muted)}
.bubble table{border-collapse:collapse;margin:.5em 0;font-size:.95em;max-width:100%;display:block;overflow-x:auto}
.bubble th,.bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.bubble thead th{background:var(--code);font-weight:600}
.bubble tbody tr:nth-child(even){background:var(--rowAlt)}
.bubble pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:8px 10px;overflow-x:auto;font-size:13px;margin:.5em 0}
.preBar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:11px;color:var(--muted)}
.preLang{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.3px}
.copyBtn{display:inline-flex;align-items:center;background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:3px 6px;font-size:11px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.copyBtn:hover{color:var(--text);border-color:var(--accent)}
.copyBtn.done{color:var(--ok);border-color:var(--ok)}
.copyBtn svg{width:12px;height:12px}
.bubble code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bubble :not(pre)>code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.bubble .math{font-family:ui-serif,Georgia,"Times New Roman",serif;font-style:italic}
details.reasoning{border:1px solid var(--border);border-left:3px solid var(--ambBd);background:transparent;border-radius:8px;max-width:100%}
details.reasoning summary{cursor:pointer;padding:6px 12px;font-size:12px;color:var(--amb);user-select:none}
details.reasoning .rmeta{color:var(--muted);font-weight:400;margin-left:8px;font-size:11px}
details.reasoning .rtext{padding:4px 12px 10px;white-space:pre-wrap;font-size:13px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rdots{display:none;margin-left:6px}
details.reasoning.streaming .rdots{display:inline-block}
.rdots i{display:inline-block;width:3px;height:3px;margin-left:2px;border-radius:50%;background:#d4a72c;animation:rdot 1.2s infinite both}
.rdots i:nth-child(2){animation-delay:.2s}
.rdots i:nth-child(3){animation-delay:.4s}
@keyframes rdot{0%,80%,100%{opacity:.2}40%{opacity:1}}
#errorBar{display:none;max-width:900px;margin:0 auto;width:calc(100% - 32px);background:var(--errBg);border:1px solid var(--errBd);color:var(--errTx);padding:8px 12px;border-radius:8px;font-size:13px}
#ctxWarn{display:none;max-width:900px;margin:0 auto 8px;width:calc(100% - 32px);background:var(--warnBg);border:1px solid var(--warnBd);color:var(--warnTx);padding:8px 12px;border-radius:8px;font-size:13px}
#ctxWarn.danger{background:var(--errBg);border-color:var(--errBd);color:var(--errTx)}
.ctxBar{max-width:900px;margin:0 auto 6px;width:calc(100% - 32px);display:flex;align-items:center;gap:10px}
.ctxBar.idle{display:none}
.ctxTrack{flex:1;height:4px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.ctxFill{height:100%;width:0;background:var(--ok);transition:width .25s ease,background-color .25s ease}
.ctxBar.warn .ctxFill{background:#e0b341}
.ctxBar.danger .ctxFill{background:var(--err)}
.ctxLabel{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ctxBar.warn .ctxLabel{color:#e0b341}
.ctxBar.danger .ctxLabel{color:var(--err)}
#composer{border-top:1px solid var(--border);background:var(--panel);padding:12px 0 18px}
.composerBox{max-width:900px;margin:0 auto;width:calc(100% - 32px);display:flex;align-items:flex-end;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.28);transition:border-color .15s ease,box-shadow .15s ease}
.composerBox:focus-within{border-color:var(--accent);box-shadow:0 8px 28px rgba(76,141,255,.18)}
#input{flex:1;background:transparent;border:none;color:var(--text);font:inherit;line-height:1.5;resize:none;max-height:240px;padding:6px 8px}
#input:focus{outline:none}
button.send{background:var(--accent);border:none;color:#fff;border-radius:14px;padding:9px 16px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s ease}
button.send:hover{background:var(--accent2)}
button.send.stop{background:var(--stopBg)}
.empty{color:var(--muted);text-align:center;margin-top:60px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.emptyIcon{line-height:1;opacity:.9;color:var(--accent)}
.emptyIcon svg{width:46px;height:46px}
.emptyTitle{font-weight:700;color:var(--text);font-size:15px;letter-spacing:.3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;max-width:560px}
.chip{background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:16px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:color .15s ease,border-color .15s ease}
.chip:hover{color:var(--text);border-color:var(--accent)}
#scrollBottomBtn{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:118px;z-index:30;width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);color:var(--muted);cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:color .15s ease,border-color .15s ease}
#scrollBottomBtn.show{display:flex}
#scrollBottomBtn:hover{color:var(--text);border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,.chatItem:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Touch devices have no hover: keep action icons visible and comfortably tappable */
@media(hover:none){
  .micons{opacity:1}
  .micon{padding:6px 10px}
  .chatItem .icon{display:inline-flex}
}
@media(max-width:760px){
  #sidebar{width:200px}
  header{padding:8px;gap:6px}
  header .logo{font-size:14px;margin-right:2px}
  /* two tidy rows instead of a cramped wrap: row 1 = toggle/logo/settings/account,
     row 2 = model picker stretched across the full width */
  .modelWrap{order:5;flex:1 1 100%}
  #model{width:100%}
  .modelDrop{max-width:calc(100vw - 24px)}
  #rightSide{gap:6px;min-width:0}
  #status{min-width:0}
  #status.showText #statusText{display:inline-block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbtnTxt{display:none}

<script>
"use strict";
const $=s=>document.querySelector(s);
const LS={settings:'chatty.settings',chats:'chatty.chats',active:'chatty.active',nav:'chatty.nav'};

/* ---------- inline SVG icons (emoji render inconsistently across OSes and can't be styled) ---------- */
const ICONS={
  pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',
  down:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  branch:'<path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
  refresh:'<path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  bot:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H9l-4.5 3.5V18A8.5 8.5 0 1 1 21 11.5z"/><circle cx="8.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="11.5" r="1.1" fill="currentColor" stroke="none"/>',
  send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/>',
  stop:'<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>',
  warn:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>'
};
function svg(inner,cls){return '<svg class="i'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>'}

let settings={baseUrl:'',apiKey:'',model:'',systemPrompt:''};
let chats=[];
let activeId=null;
let models=[];
let streaming=false,aborter=null;

/* ---------- auth + storage (server-backed when available, localStorage fallback) ---------- */
let serverMode=false;      // true once /api/me confirms a session
let loggedInUser=null;     // display name
let isAdmin=false;         // admin account (INITIAL_USER) -> gets the "Users" button
let regOpenFlag=true,maxUsersFlag=10;
let saveTimer=null;
let serverRev=0;   // rev of the last server state we saw or wrote (change detection across devices)
let dirty=false;   // local changes not yet pushed to the server
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}}
function loadLocalData(){
  settings=load(LS.settings,{baseUrl:'',apiKey:'',model:'',systemPrompt:''});
  chats=load(LS.chats,[]);
  activeId=localStorage.getItem(LS.active)||null;
}
function lsSave(){
  try{
    localStorage.setItem(LS.settings,JSON.stringify(settings));
    localStorage.setItem(LS.chats,JSON.stringify(chats));
    if(activeId)localStorage.setItem(LS.active,activeId);
  }catch(e){
    showError('Browser storage is full or unavailable \u2014 changes are NOT being saved. Export chats to file (\u2B07 / MD) or delete old ones.');
  }
}
function save(){
  if(serverMode){
    dirty=true;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(pushData,600);
  }else lsSave();
}
async function pushData(){
  try{
    const res=await fetch('api/data',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({settings,chats,activeId})});
    if(res.ok){const j=await res.json().catch(()=>({}));serverRev=j.rev??serverRev+1;dirty=false}
    else showError('Could not save to server \u2014 changes are only in this browser tab for now.');
  }
  catch(e){showError('Could not save to server \u2014 changes are only in this browser tab for now.')}
}

/* cross-device sync: poll the server for changes made by other devices of the same user.
   Unchanged polls are cheap (ETag -> 304, no body). While streaming we skip pulling so an
   in-flight reply is never clobbered; pending local changes are flushed before a pull. */
async function pollSync(){
  if(!serverMode||streaming||document.hidden)return;
  try{
    const res=await fetch('api/data',{headers:{'If-None-Match':'"'+serverRev+'"'}});
    if(res.status===304||!res.ok)return;
    const j=await res.json();
    if((j.rev||0)===serverRev)return;
    if(dirty){clearTimeout(saveTimer);pushData();return} // flush ours first; the next poll reconciles
    applyServerData(j);
  }catch{}
}
setInterval(pollSync,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollSync()});
function bindValues(){
  $('#baseUrl').value=settings.baseUrl||'';
  $('#model').value=settings.model||'';
  $('#apiKey').value=settings.apiKey||'';
  $('#sysPrompt').value=settings.systemPrompt||'';
}

/* ---------- auth screen ---------- */
const authForm=$('#authForm'),authErr=$('#authErr'),authAlt=$('#authAlt');
function showAuth(){$('#authScreen').style.display='flex'}
function hideAuth(){$('#authScreen').style.display='none'}
function setAuthMode(mode){
  authForm.dataset.mode=mode;
  $('#authSubmit').textContent=mode==='login'?'Sign in':'Create account';
  $('#authSub').textContent=mode==='login'?'Sign in to your account':'Create a new account';
  authErr.textContent='';
  renderAuthAlt();
}
function renderAuthAlt(){
  const mode=authForm.dataset.mode||'login';
  authAlt.innerHTML='';
  if(mode==='login'){
    const a=document.createElement('button');a.type='button';a.className='authLink';
    a.textContent=regOpenFlag?'No account yet? Create one':'Registration is closed \u2014 sign in instead';
    a.disabled=!regOpenFlag;
    if(regOpenFlag)a.onclick=()=>setAuthMode('register');
    authAlt.appendChild(a);
  }else{
    const n=document.createElement('span');n.className='authNote';
    n.textContent='Up to '+maxUsersFlag+' users \u00B7 registration closes when the limit is reached.';
    const b=document.createElement('button');b.type='button';b.className='authLink';
    b.textContent='Already have an account? Sign in';
    b.onclick=()=>setAuthMode('login');
    authAlt.appendChild(n);authAlt.appendChild(b);
  }
}
async function apiJSON(url,method,body){
  const res=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await res.json()}catch{}
  if(!res.ok)throw new Error(j.error||('HTTP '+res.status));
  return j;
}
function applyServerData(j){
  serverRev=j.rev||0;
  const s={baseUrl:j.settings?.baseUrl||'',apiKey:j.settings?.apiKey||'',model:j.settings?.model||'',systemPrompt:j.settings?.systemPrompt||''};
  chats=Array.isArray(j.chats)?j.chats:[];
  activeId=j.activeId||null;
  if(JSON.stringify(s)!==JSON.stringify(settings)){settings=s;bindValues()} // don't clobber half-typed settings fields
  renderChatList();renderMessages();updateCtxBar();
}
async function loadServerData(){
  const j=await apiJSON('api/data','GET');
  applyServerData(j);
}
async function doAuth(){
  const u=$('#authUser').value.trim(),p=$('#authPass').value;
  authErr.textContent='';
  $('#authSubmit').disabled=true;
  try{
    const mode=authForm.dataset.mode||'login';
    const j=await apiJSON(mode==='login'?'api/login':'api/register','POST',{username:u,password:p});
    loggedInUser=j.user;isAdmin=!!j.admin;serverMode=true;
    await loadServerData();
    hideAuth();closeSettings();showUserChip();bindValues();
    if(!chats.length)newChat();else if(!activeChat())activeId=chats[0].id;
    renderChatList();renderMessages();fetchModels();updateCtxBar();
  }catch(e){authErr.textContent=e.message}
  finally{$('#authSubmit').disabled=false}
}
function showUserChip(){$('#userName').textContent=loggedInUser||'';$('#usersBox').style.display=isAdmin?'flex':'none';$('#userChip').style.display='block'}
async function logout(){
  if(streaming&&aborter)aborter.abort(); // stop the stream BEFORE flipping modes, else its
  // finally-block would save the server user's chats into local mode's localStorage
  try{await fetch('api/logout',{method:'POST'})}catch{}
  serverMode=false;loggedInUser=null;isAdmin=false;models=[];
  serverRev=0;dirty=false;
  closeUsersDrop();closeUserDrop();
  $('#usersBox').style.display='none';
  $('#userChip').style.display='none';
  setAuthMode('login');showAuth();
  loadLocalData();bindValues();
  if(!chats.length)newChat();else if(!activeChat())activeId=chats[0].id;
  renderChatList();renderMessages();fetchModels();updateCtxBar();
}
async function initAuth(){
  let status=null;
  if(location.protocol!=='file:'){ // fetch() doesn't work on file:// at all
    try{status=await apiJSON('api/status','GET')}catch{}
  }
  if(!status){ // no backend (file:// or plain static hosting) -> original local mode
    hideAuth();loadLocalData();return;
  }
  regOpenFlag=!!status.canRegister;maxUsersFlag=status.maxUsers||10;
  renderAuthAlt();
  try{
    const me=await apiJSON('api/me','GET');
    loggedInUser=me.user;isAdmin=!!me.admin;serverMode=true;
    await loadServerData();
    hideAuth();showUserChip();
  }catch{
    showAuth(); // server present, not logged in -> stay on the login screen
  }
}

/* ---------- admin: registered users dropdown ---------- */
const usersBtn=$('#usersBtn'),usersDrop=$('#usersDrop');
function fmtLogin(iso){
  if(!iso)return'never';
  const d=new Date(iso);
  if(isNaN(d))return iso;
  return d.toLocaleDateString()+' '+d.toLocaleTimeString();
}
function renderUsers(list){
  usersDrop.innerHTML='';
  const mk=(tag,txt)=>{const el=document.createElement(tag);el.textContent=txt;return el};
  const t=document.createElement('table');
  const hr=document.createElement('tr');hr.append(mk('th','User'),mk('th','Last login'));t.appendChild(hr);
  for(const u of list){
    const tr=document.createElement('tr');
    tr.append(mk('td',u.name),mk('td',fmtLogin(u.lastLogin)));
    t.appendChild(tr);
  }
  usersDrop.appendChild(t);
}
async function openUsers(){
  if(usersDrop.classList.contains('open')){usersDrop.classList.remove('open');return}
  try{
    const j=await apiJSON('api/users','GET');
    renderUsers(j.users||[]);
    usersDrop.classList.add('open');
  }catch(e){
    usersDrop.innerHTML='';
    const p=document.createElement('div');p.style.cssText='font-size:12.5px;color:var(--err)';p.textContent=e.message;
    usersDrop.appendChild(p);usersDrop.classList.add('open');
  }
}
function closeUsersDrop(){usersDrop.classList.remove('open')}
usersBtn.onclick=e=>{e.stopPropagation();openUsers()};
document.addEventListener('click',e=>{if(!e.target.closest('#usersBox'))closeUsersDrop()});

/* user chip: dropdown with the logout action */
const userBtn=$('#userBtn'),userDrop=$('#userDrop');
function closeUserDrop(){userDrop.classList.remove('open')}
userBtn.onclick=e=>{e.stopPropagation();userDrop.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('#userChip'))closeUserDrop()});

function normalizeBase(u){
  u=(u||'').trim().replace(/\/+$/,'');
  if(!u)return'';
  if(!/^https?:\/\//i.test(u))u='http://'+u;
  if(!/\/v\d+$/.test(u))u+='/v1';
  return u;
}
function authHeaders(){
  const h={'Content-Type':'application/json'};
  if(settings.apiKey)h['Authorization']='Bearer '+settings.apiKey;
  return h;
}

/* ---------- models / connection status ---------- */
let modelTimer=null;
async function fetchModels(){
  const base=normalizeBase(settings.baseUrl);
  models=[];
  if(!base){setStatus('','no server');return}
  try{
    const res=await fetch(base+'/models',{headers:authHeaders()});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const j=await res.json();
    models=(j.data||[]).map(m=>({id:m.id,ctx:modelCtx(m)}));
    setStatus('ok',models.length+' model'+(models.length===1?'':'s'));
  }catch(e){setStatus('err',e.message)}
  if(modelDrop.classList.contains('open'))renderModelDrop();
  updateCtxBar();
}
function scheduleModels(){clearTimeout(modelTimer);modelTimer=setTimeout(fetchModels,500)}
function setStatus(cls,text){
  const s=$('#status');
  // toggle classes instead of rewriting className, so "busy" and "showText" survive status updates
  s.classList.toggle('ok',cls==='ok');s.classList.toggle('err',cls==='err');
  s.title=text;$('#statusText').textContent=text;
}

/* ---------- minimal markdown (offline, no deps) ---------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* Models frequently emit LaTeX math ($...$, \(...\), \[...\] with \commands). No math
   engine is allowed (CSP blocks external scripts), so map common commands to Unicode. */
const TEXMAP={rightarrow:'\u2192',Rightarrow:'\u21d2',leftarrow:'\u2190',Leftarrow:'\u21d0',leftrightarrow:'\u2194',Leftrightarrow:'\u21d4',to:'\u2192',gets:'\u2190',mapsto:'\u21a6',times:'\u00d7',div:'\u00f7',cdot:'\u00b7',ast:'\u2217',circ:'\u2218',bullet:'\u2219',pm:'\u00b1',mp:'\u2213',leq:'\u2264',le:'\u2264',geq:'\u2265',ge:'\u2265',neq:'\u2260',ne:'\u2260',equiv:'\u2261',approx:'\u2248',cong:'\u2245',sim:'\u223c',propto:'\u221d',infty:'\u221e',partial:'\u2202',nabla:'\u2207',in:'\u2208',notin:'\u2209',ni:'\u220b',subset:'\u2282',subseteq:'\u2286',supset:'\u2283',supseteq:'\u2287',cup:'\u222a',cap:'\u2229',setminus:'\u2216',emptyset:'\u2205',varnothing:'\u2205',forall:'\u2200',exists:'\u2203',neg:'\u00ac',land:'\u2227',lor:'\u2228',wedge:'\u2227',vee:'\u2228',oplus:'\u2295',otimes:'\u2297',perp:'\u22a5',parallel:'\u2225',angle:'\u2220',degree:'\u00b0',prime:'\u2032',hbar:'\u210f',ell:'\u2113',Re:'\u211c',Im:'\u2111',aleph:'\u2135',ldots:'\u2026',cdots:'\u22ef',vdots:'\u22ee',ddots:'\u22f1',dots:'\u2026',alpha:'\u03b1',beta:'\u03b2',gamma:'\u03b3',delta:'\u03b4',epsilon:'\u03b5',varepsilon:'\u03b5',zeta:'\u03b6',eta:'\u03b7',theta:'\u03b8',vartheta:'\u03d1',iota:'\u03b9',kappa:'\u03ba',lambda:'\u03bb',mu:'\u03bc',nu:'\u03bd',xi:'\u03be',pi:'\u03c0',rho:'\u03c1',sigma:'\u03c3',varsigma:'\u03c2',tau:'\u03c4',upsilon:'\u03c5',phi:'\u03c6',varphi:'\u03d5',chi:'\u03c7',psi:'\u03c8',omega:'\u03c9',Gamma:'\u0393',Delta:'\u0394',Theta:'\u0398',Lambda:'\u039b',Xi:'\u039e',Pi:'\u03a0',Sigma:'\u03a3',Upsilon:'\u03a5',Phi:'\u03a6',Psi:'\u03a8',Omega:'\u03a9',langle:'\u27e8',rangle:'\u27e9',lceil:'\u2308',rceil:'\u2309',lfloor:'\u230a',rfloor:'\u230b',therefore:'\u2234',because:'\u2235',checkmark:'\u2713',dagger:'\u2020',pmod:' mod ',bmod:' mod ',sum:'\u2211',prod:'\u220f',int:'\u222b',oint:'\u222e',coprod:'\u2210',pounds:'\u00a3',copyright:'\u00a9',textdegree:'\u00b0'};
const SUP={'0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079','+':'\u207a','-':'\u207b','=':'\u207c','(':'\u207d',')':'\u207e','n':'\u207f','i':'\u2071'};
const SUB={'0':'\u2080','1':'\u2081','2':'\u2082','3':'\u2083','4':'\u2084','5':'\u2085','6':'\u2086','7':'\u2087','8':'\u2088','9':'\u2089','+':'\u208a','-':'\u208b','=':'\u208c','(':'\u208d',')':'\u208e','n':'\u2099','a':'\u2090','e':'\u2091','k':'\u2096','l':'\u2097','m':'\u2098','p':'\u209a','s':'\u209b','t':'\u209c','x':'\u2093'}; // no subscript i/j in Unicode
const convScript=(s,map)=>{const a=[...s].map(c=>map[c]);return a.every(c=>c!==undefined)?a.join(''):null};
function tex(x){
  x=x.replace(/\s*\n\s*/g,' ');
  // literal escapes: protect \{ \} from the brace-stripping at the end (\u0003/\u0004 placeholders)
  x=x.replace(/\\([%$&#_{}])/g,(m,c)=>c==='{'?'\u0003':c==='}'?'\u0004':c);
  x=x.replace(/\\[dtc]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'($1)/($2)');
  x=x.replace(/\\sqrt\s*\{([^{}]*)\}/g,'\u221a($1)');
  x=x.replace(/\\(?:text|textbf|textit|textrm|textsf|mathrm|mathbf|mathit|mathsf|mathtt|mathcal|mathbb|mathfrak|boldsymbol|operatorname)\s*\{([^{}]*)\}/g,'$1');
  x=x.replace(/\\(?:widehat|hat)\s*\{([^{}]*)\}/g,'$1\u0302').replace(/\\vec\s*\{([^{}]*)\}/g,'$1\u20d7').replace(/\\(?:overline|bar)\s*\{([^{}]*)\}/g,'$1\u0305').replace(/\\tilde\s*\{([^{}]*)\}/g,'$1\u0303').replace(/\\dot\s*\{([^{}]*)\}/g,'$1\u0307');
  // (?![a-zA-Z]) so \big doesn't eat the prefix of \bigstar and \right not of \rightarrow
  x=x.replace(/\\(?:left|right|middle|biggl|biggr|Biggl|Biggr|bigl|bigr|Bigl|Bigr|bigg|Bigg|big|Big|displaystyle|textstyle|scriptstyle|limits|nolimits)(?![a-zA-Z])/g,'');
  x=x.replace(/\\(?:qquad|quad)(?![a-zA-Z])/g,' ');
  x=x.replace(/\\[,;:!]/g,' ');
  x=x.replace(/\\\\/g,' '); // LaTeX line break inside math
  x=x.replace(/\^\{([^{}]+)\}/g,(m,s)=>convScript(s,SUP)||'^('+s+')');
  x=x.replace(/_\{([^{}]+)\}/g,(m,s)=>convScript(s,SUB)||'_('+s+')');
  x=x.replace(/\^([0-9a-zA-Z+-])/g,(m,c)=>SUP[c]||'^'+c);
  x=x.replace(/_([0-9a-zA-Z+-])/g,(m,c)=>SUB[c]||'_'+c);
  x=x.replace(/\\([a-zA-Z]+)/g,(m,w)=>TEXMAP[w]!==undefined?TEXMAP[w]:'\\'+w);
  x=x.replace(/[{}]/g,'');
  return x.replace(/\u0003/g,'{').replace(/\u0004/g,'}').trim();
}
/* Bare LaTeX in prose (not wrapped in $): convert only whitelisted commands so regex
   snippets, Windows paths etc. in normal text stay untouched. Braces are kept unless
   part of a converted command. */
function texPlain(x){
  x=x.replace(/\\[dtc]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'($1)/($2)');
  x=x.replace(/\\sqrt\s*\{([^{}]*)\}/g,'\u221a($1)');
  x=x.replace(/\\(?:widehat|hat)\s*\{([^{}]*)\}/g,'$1\u0302').replace(/\\vec\s*\{([^{}]*)\}/g,'$1\u20d7').replace(/\\(?:overline|bar)\s*\{([^{}]*)\}/g,'$1\u0305').replace(/\\tilde\s*\{([^{}]*)\}/g,'$1\u0303').replace(/\\dot\s*\{([^{}]*)\}/g,'$1\u0307');
  x=x.replace(/\\(?:text|textbf|textit|textrm|textsf|mathrm|mathbf|mathit|mathsf|mathtt|mathcal|mathbb|mathfrak|boldsymbol|operatorname)\s*\{([^{}]*)\}/g,'$1');
  x=x.replace(/\\(?:left|right|middle|biggl|biggr|Biggl|Biggr|bigl|bigr|Bigl|Bigr|bigg|Bigg|big|Big|displaystyle|textstyle|scriptstyle)(?![a-zA-Z])/g,'');
  x=x.replace(/\\(?:qquad|quad)(?![a-zA-Z])/g,' ');
  // literal escapes (\% \& \$ \# \_ \{ \}) — note & already became &amp; via esc()
  x=x.replace(/\\([%$&#_{}])/g,'$1');
  // 'to' excluded: \to in bare prose is usually a Windows path (C:\to\...), not an arrow
  x=x.replace(/\\([a-zA-Z]+)/g,(m,w)=>TEXMAP[w]!==undefined&&w!=='to'?TEXMAP[w]:m);
  return x;
}
function md(src){
  let s=(src||'').trim();
  // strip control chars (keep \t \n \r): they'd collide with the \u0000/\u0002 placeholder
  // markers used below and could make placeholders resolve to undefined
  s=s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g,'');
  const fence=s.match(/^```(?:markdown|md)\n([\s\S]*)\n?```\s*$/i);
  if(fence)s=fence[1];
  const codes=[];
  let t=esc(s);
  t=t.replace(/```(\w*)[ \t]*\n([\s\S]*?)(?:```|$)/g,(m,lang,code)=>{
    codes.push('<pre'+(lang?' data-lang="'+lang+'"':'')+'><code>'+code.replace(/\n$/,'')+'</code></pre>');
    return '\u0000'+(codes.length-1)+'\u0000';
  });
  t=t.replace(/`([^`\n]+)`/g,(m,c)=>{
    codes.push('<code>'+c+'</code>');
    return '\u0000'+(codes.length-1)+'\u0000';
  });
  // Extract math before block/inline parsing so $ or \ inside math can't confuse it.
  // Currency like "$5 and $10" is skipped: math must not start/end with whitespace.
  const maths=[];
  const pushMath=x=>{maths.push('<span class="math">'+tex(x)+'</span>');return '\u0002'+(maths.length-1)+'\u0002'};
  t=t.replace(/\$\$([\s\S]+?)\$\$/g,(m,x)=>pushMath(x));
  t=t.replace(/\\\[([\s\S]+?)\\\]/g,(m,x)=>pushMath(x));
  t=t.replace(/\\\(([\s\S]+?)\\\)/g,(m,x)=>pushMath(x));
  t=t.replace(/(?<![\\$])\$(?![\s$])([^$\n]+?)(?<!\s)\$(?!\d)/g,(m,x)=>{
    // currency runs like "$4x und 100$": digit-led + spaces but no math syntax -> not math
    if(/^\d/.test(x)&&/\s/.test(x)&&!/[\\=^_{}()\[\]]/.test(x))return m;
    return pushMath(x);
  });
  const inline=x=>x
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    // plain-text scripts like 2^{10} or H_{2}O (outside math) — braced form only, so
    // bare ^ or _ in regex-ish prose is left alone
    .replace(/\^\{([^{}]+)\}/g,(m,s)=>convScript(s,SUP)||m)
    .replace(/_\{([^{}]+)\}/g,(m,s)=>convScript(s,SUB)||m)
    // command + its {arg}s as a unit (\frac{a}{b} has two); unknown commands keep them.
    // bare \\ and \, left alone in prose (Windows paths, regexes) — they stay literal
    .replace(/\\[a-zA-Z]+(?:\s*\{[^{}]*\})*/g,m=>texPlain(m))
    // literal LaTeX escapes in prose: \% \$ \# \_ \{ \} and \& (already &amp; via esc)
    .replace(/\\&amp;/g,'&amp;')
    .replace(/\\([%$#_{}])/g,'$1')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,txt,url)=>'<a href="'+url.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener">'+txt+'</a>');
  // Render a block line-by-line so mixed content (paragraph + list, heading in the
  // middle, ...) works. List markers allow any amount of whitespace after them
  // (models often emit "*   item"), and ordered lists may use "1)" too.
  const isH=l=>/^#{1,6} \S/.test(l);
  const isUl=l=>/^[-*+]\s+/.test(l);
  const isOl=l=>/^\d+[.)]\s+/.test(l);
  const isBq=l=>/^&gt;/.test(l);
  const isHr=l=>/^ *(?:-{3,}|\*{3,}|_{3,}) *$/.test(l);
  const isCodePh=l=>/^\u0000\d+\u0000$/.test(l);
  const special=l=>isH(l)||isUl(l)||isOl(l)||isBq(l)||isHr(l)||isCodePh(l);
  const renderLines=lines=>{
    let out='';let i=0;
    while(i<lines.length){
      const l=lines[i];
      if(isCodePh(l)){out+=l;i++;continue} // fenced code: emit standalone, never inside <p>
      if(isHr(l)){out+='<hr/>';i++;continue}
      if(isH(l)){const h=l.match(/^(#{1,6}) (.+)$/);out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';i++;continue}
      if(isUl(l)){const it=[];while(i<lines.length&&isUl(lines[i])){it.push(lines[i].replace(/^[-*+]\s+/,''));i++}out+='<ul>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';continue}
      if(isOl(l)){const it=[];while(i<lines.length&&isOl(lines[i])){it.push(lines[i].replace(/^\d+[.)]\s+/,''));i++}out+='<ol>'+it.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';continue}
      if(isBq(l)){const it=[];while(i<lines.length&&isBq(lines[i])){it.push(lines[i].replace(/^&gt;\s?/,''));i++}out+='<blockquote>'+it.map(x=>inline(x)).join('<br>')+'</blockquote>';continue}
      const buf=[];while(i<lines.length&&!special(lines[i])){buf.push(lines[i]);i++}
      out+='<p>'+inline(buf.join('\n')).replace(/\n/g,'<br>')+'</p>';
    }
    return out;
  };
  t=t.split(/\n{2,}/).map(block=>{
    block=block.trim();
    if(!block)return'';
    if(/^\u0000\d+\u0000$/.test(block))return block;
    const lines=block.split('\n');
    // GFM table: a header row followed by a separator row (| --- | :---: | ...),
    // possibly with other lines before/after it in the same block.
    const isSep=l=>/^\s*\|?[\s:\-|]+\|?\s*$/.test(l)&&l.includes('-');
    const ti=lines.findIndex((l,i)=>i<lines.length-1&&l.includes('|')&&isSep(lines[i+1])&&(lines[i+1].includes('|')||l.trim().startsWith('|')));
    if(ti!==-1){
      const parseRow=l=>{let r=l.trim().replace(/\\\|/g,'\u0001');if(r.startsWith('|'))r=r.slice(1);if(r.endsWith('|'))r=r.slice(0,-1);return r.split('|').map(c=>c.replace(/\u0001/g,'|').trim())};
      const aligns=parseRow(lines[ti+1]).map(c=>{const l=c.startsWith(':'),r=c.endsWith(':');return l&&r?'center':r?'right':l?'left':''});
      let end=ti+2;while(end<lines.length&&lines[end].includes('|'))end++;
      const head=parseRow(lines[ti]);
      const rows=lines.slice(ti+2,end).map(parseRow);
      const cell=(c,i,tag)=>'<'+tag+(aligns[i]?' style="text-align:'+aligns[i]+'"':'')+'>'+inline(c)+'</'+tag+'>';
      let html='<table><thead><tr>'+head.map((c,i)=>cell(c,i,'th')).join('')+'</tr></thead>';
      if(rows.length)html+='<tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>cell(c,i,'td')).join('')+'</tr>').join('')+'</tbody>';
      html+='</table>';
      const pre=ti>0?renderLines(lines.slice(0,ti)):'';
      const post=end<lines.length?renderLines(lines.slice(end)):'';
      return pre+html+post;
    }
    return renderLines(lines);
  }).filter(Boolean).join('');
  t=t.replace(/\u0000(\d+)\u0000/g,(m,i)=>codes[+i]);
  t=t.replace(/\u0002(\d+)\u0002/g,(m,i)=>maths[+i]);
  return t;
}
/* Clipboard with a fallback: the async clipboard API needs a secure context, and
   ChattyLAN is often served over plain http:// on a LAN. */
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}
  catch{
    const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch{ok=false}
    ta.remove();return ok;
  }
}
/* Add a language label + copy button above every rendered code block. */
function enhanceCodeBlocks(root){
  for(const pre of root.querySelectorAll('pre[data-lang],pre')){
    if(pre.previousElementSibling&&pre.previousElementSibling.classList.contains('preBar'))continue;
    if(pre.parentElement&&pre.parentElement.classList.contains('preWrap'))continue;
    const bar=document.createElement('div');bar.className='preBar';
    const lang=document.createElement('span');lang.className='preLang';lang.textContent=pre.dataset.lang||'code';
    const btn=document.createElement('button');btn.type='button';btn.className='copyBtn';
    btn.innerHTML=svg(ICONS.copy);btn.title='Copy code';
    btn.onclick=async()=>{
      const ok=await copyText(pre.innerText);
      btn.classList.toggle('done',ok);
      btn.innerHTML=svg(ok?ICONS.check:ICONS.x);
      setTimeout(()=>{btn.classList.remove('done');btn.innerHTML=svg(ICONS.copy)},1600);
    };
    bar.appendChild(lang);bar.appendChild(btn);
    pre.parentNode.insertBefore(bar,pre);
  }
}

/* ---------- chats ---------- */
function activeChat(){return chats.find(c=>c.id===activeId)||null}
function newChat(){
  const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),title:'New chat',messages:[],createdAt:Date.now()};
  chats.unshift(c);activeId=c.id;save();renderChatList();renderMessages();
  return c;
}
/* Sidebar date grouping: chats carry createdAt; older ones fall back to the
   base36 timestamp embedded at the start of their id (Date.now().toString(36)). */
function chatTime(c){
  if(typeof c.createdAt==='number'&&c.createdAt)return c.createdAt;
  const t=parseInt(c.id.slice(0,8),36);
  return Number.isFinite(t)?t:0;
}
function groupLabel(ts){
  if(!ts)return'Chats';
  const today=new Date();today.setHours(0,0,0,0);
  const day=864e5;
  if(ts>=today.getTime())return'Today';
  if(ts>=today.getTime()-day)return'Yesterday';
  if(ts>=today.getTime()-7*day)return'Last 7 days';
  return'Earlier';
}
function deleteChat(id){
  const c=chats.find(x=>x.id===id);
  if(c&&!confirm('Delete chat \u201C'+c.title+'\u201D? This cannot be undone.'))return;
  chats=chats.filter(x=>x.id!==id);
  if(activeId===id)activeId=chats[0]?chats[0].id:null;
  if(!chats.length){newChat();return}
  save();renderChatList();renderMessages();
}
function renderChatList(){
  const el=$('#chatList');el.innerHTML='';
  const sorted=[...chats].sort((a,b)=>chatTime(b)-chatTime(a));
  let lastGroup=null;
  for(const c of sorted){
    const g=groupLabel(chatTime(c));
    if(g!==lastGroup){const h=document.createElement('div');h.className='chatGroup';h.textContent=g;el.appendChild(h);lastGroup=g}
    const d=document.createElement('div');
    d.className='chatItem'+(c.id===activeId?' active':'');
    const t=document.createElement('span');t.className='title';t.textContent=c.title;
    const n=document.createElement('span');n.className='icon renIco';n.innerHTML=svg(ICONS.pen);n.title='Rename chat';
    n.onclick=e=>{e.stopPropagation();startRename(c,d,t)};
    const s=document.createElement('span');s.className='icon saveIco';s.innerHTML=svg(ICONS.down);s.title='Save chat to file (JSON)';
    s.onclick=e=>{e.stopPropagation();downloadChat(c)};
    const mdi=document.createElement('span');mdi.className='icon mdIco';mdi.textContent='MD';mdi.title='Export as Markdown';
    mdi.onclick=e=>{e.stopPropagation();downloadChatMd(c)};
    const x=document.createElement('span');x.className='icon del';x.innerHTML=svg(ICONS.x);x.title='Delete chat';
    x.onclick=e=>{e.stopPropagation();deleteChat(c.id)};
    d.onclick=()=>{activeId=c.id;save();renderChatList();renderMessages()};
    d.appendChild(t);d.appendChild(n);d.appendChild(s);d.appendChild(mdi);d.appendChild(x);el.appendChild(d);
  }
}

/* ---------- rename ---------- */
function startRename(c,item,titleEl){
  const inp=document.createElement('input');
  inp.className='renameInput';inp.value=c.title;
  item.insertBefore(inp,titleEl);
  titleEl.style.display='none';
  inp.focus();inp.select();
  let done=false;
  const commit=ok=>{
    if(done)return;done=true;
    const v=inp.value.trim();
    if(ok&&v)c.title=v;
    save();renderChatList();
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter')commit(true);
    else if(e.key==='Escape')commit(false);
  });
  inp.addEventListener('blur',()=>commit(true));
}

/* ---------- save / load to file ---------- */
function safeName(t){return (t||'chat').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'chat'}
function downloadText(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function downloadChat(c){
  downloadText(safeName(c.title)+'.json',
    JSON.stringify({app:'chatty-lan',version:1,title:c.title,savedAt:new Date().toISOString(),messages:c.messages},null,2),
    'application/json');
}
function chatToMarkdown(c){
  const L=['# '+(c.title||'Chat'),'','_Exported from ChattyLAN \u00B7 '+new Date().toISOString()+'_',''];
  for(const m of c.messages){
    if(!m.content)continue;
    L.push('## '+(m.role==='user'?'You':'Assistant'),'',m.content,'');
  }
  return L.join('\n');
}
function downloadChatMd(c){downloadText(safeName(c.title)+'.md',chatToMarkdown(c),'text/markdown')}
function importChat(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.messages))throw new Error('not a ChattyLAN chat file');
      const msgs=d.messages
        .filter(m=>(m.role==='user'||m.role==='assistant')&&typeof m.content==='string'&&m.content)
        .map(m=>({role:m.role,content:m.content,reasoning:typeof m.reasoning==='string'?m.reasoning:''}));
      if(!msgs.length)throw new Error('no valid messages in file');
      const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        title:(typeof d.title==='string'&&d.title)||'Imported chat',messages:msgs,createdAt:Date.now()};
      chats.unshift(c);activeId=c.id;save();renderChatList();renderMessages();clearError();
    }catch(err){showError('Import failed: '+err.message)}
  };
  r.readAsText(file);
}

/* ---------- context usage ---------- */
function modelCtx(m){
  const c=(m.meta&&typeof m.meta.context_length==='number')?m.meta.context_length:(typeof m.context_length==='number'?m.context_length:NaN);
  return Number.isFinite(c)&&c>0?c:null;
}
/* chars/3: a better fit for dense tokenizers (Qwen & co.) than the classic /4 */
function estTokens(s){return Math.ceil((s||'').length/3)}
function fmtTok(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+n}
function chatTokens(chat){
  // Prefer the real prompt_tokens reported by the server for the last request,
  // plus a chars/3 estimate for messages added since (e.g. the new reply).
  if(chat.lastUsage&&chat.lastUsage.prompt>0){
    let t=chat.lastUsage.prompt;
    const n=chat.lastUsageMsgCount||0;
    for(let i=n;i<chat.messages.length;i++){
      const m=chat.messages[i];
      t+=estTokens(m.content)+(m.reasoning?estTokens(m.reasoning):0);
    }
    return t;
  }
  let t=0;
  if(settings.systemPrompt.trim())t+=estTokens(settings.systemPrompt);
  for(const m of chat.messages)t+=estTokens(m.content)+(m.reasoning?estTokens(m.reasoning):0);
  return t;
}
function updateCtxBar(){
  const bar=$('#ctxBar'),fill=$('#ctxFill'),label=$('#ctxLabel'),warn=$('#ctxWarn');
  const chat=activeChat();
  const used=chat?chatTokens(chat):0;
  const real=!!(chat&&chat.lastUsage&&chat.lastUsage.prompt>0);
  const approx=real?'':'\u2248 ';
  label.title=real
    ?'Based on the last request: '+fmtTok(chat.lastUsage.prompt)+' prompt + '+fmtTok(chat.lastUsage.completion||0)+' completion tokens (reported by the server).'
    :'Estimated from character count (~3 chars per token).';
  let m=models.find(x=>x.id===settings.model);
  if(!m)m=models.find(x=>x.id.toLowerCase()===(settings.model||'').toLowerCase()); // tolerate case drift
  const limit=m&&m.ctx?m.ctx:null;
  if(!limit){
    fill.style.width='0%';
    label.textContent=approx+fmtTok(used)+' tokens \u00B7 no context limit known for this model';
    bar.className='ctxBar'+(used?'':' idle');
    warn.style.display='none';warn.className='';
    return;
  }
  const pct=used/limit*100;
  fill.style.width=Math.min(100,pct).toFixed(1)+'%';
  label.textContent=approx+fmtTok(used)+' / '+fmtTok(limit)+' tokens ('+Math.round(pct)+'%)';
  bar.className='ctxBar'+(pct>=90?' danger':pct>=70?' warn':'')+((!used||pct<10)?' idle':'');
  if(pct>=90){
    warn.style.display='block';
    warn.className=pct>100?'danger':'';
    warn.textContent=pct>100
      ?'Estimated context exceeds the model limit ('+Math.round(pct)+'%) \u2014 the server will likely reject new messages. Start a new chat or trim history.'
      :'Context nearly full ('+Math.round(pct)+'%) \u2014 the next request may fail. Consider starting a new chat.';
  }else{warn.style.display='none';warn.className=''}
}

function buildMessages(chat){
  const out=[];
  if(settings.systemPrompt.trim())out.push({role:'system',content:settings.systemPrompt.trim()});
  for(const m of chat.messages){
    if(!m.content)continue;
    const msg={role:m.role,content:m.content};
    if(m.reasoning)msg.reasoning_content=m.reasoning;
    out.push(msg);
  }
  return out;
}

function msgEl(m,idx,isLast){
  const d=document.createElement('div');
  d.className='msg '+m.role;
  const av=document.createElement('div');av.className='avatar';
  av.innerHTML=svg(m.role==='user'?ICONS.user:ICONS.bot);
  d.appendChild(av);
  const body=document.createElement('div');body.className='mbody';
  const isErr=m.role==='assistant'&&!!m.error;
  const showBranch=m.role==='user'&&idx>0;
  const showRegen=isLast&&m.role==='assistant';
  const canCopy=!!m.content;
  let icons=null;
  if(showBranch||showRegen||canCopy){
    icons=document.createElement('span');icons.className='micons'+(isErr?' pinned':'');
    if(showBranch||showRegen){
      const b=document.createElement('button');b.className='micon';
      if(m.role==='user'){
        b.innerHTML=svg(ICONS.branch);b.title='Branch here (new chat with history up to this point)';
        b.onclick=()=>branchAt(idx);
      }else{
        b.innerHTML=svg(ICONS.refresh);b.title=isErr?'Retry \u2014 regenerate answer':'Regenerate answer';
        b.onclick=regenerate;
      }
      icons.appendChild(b);
    }
    if(canCopy){
      const cp=document.createElement('button');cp.className='micon';
      cp.innerHTML=svg(ICONS.copy);cp.title='Copy message text';
      cp.onclick=async()=>{
        const ok=await copyText(m.content);
        cp.classList.toggle('done',ok);
        cp.innerHTML=svg(ok?ICONS.check:ICONS.x);
        setTimeout(()=>{cp.classList.remove('done');cp.innerHTML=svg(ICONS.copy)},1600);
      };
      icons.appendChild(cp);
    }
  }
  const head=document.createElement('div');head.className='mhead';
  const who=document.createElement('div');who.className='who';
  who.textContent=m.role==='user'?'You':'Assistant';
  head.appendChild(who);
  if(icons)head.appendChild(icons);
  body.appendChild(head);
  if(m.role==='assistant'&&m.reasoning){
    const det=document.createElement('details');det.className='reasoning';
    const sum=document.createElement('summary');sum.textContent='Reasoning';
    if(m.reasoning.length>200){const meta=document.createElement('span');meta.className='rmeta';meta.textContent=m.reasoning.length+' chars';sum.appendChild(meta)}
    const rt=document.createElement('div');rt.className='rtext';rt.textContent=m.reasoning;
    det.appendChild(sum);det.appendChild(rt);
    body.appendChild(det);
  }
  const b=document.createElement('div');b.className='bubble';
  if(m.role==='user')b.textContent=m.content;
  else if(isErr&&!m.content){b.classList.add('err');b.innerHTML=svg(ICONS.warn)+' '+esc(m.error)}
  else b.innerHTML=md(m.content);
  body.appendChild(b);
  if(isErr&&m.content){const n=document.createElement('div');n.className='errNote';n.innerHTML=svg(ICONS.warn)+' '+esc(m.error)}
  d.appendChild(body);
  return d;
}

function renderMessages(){
  const inner=$('#msgInner');inner.innerHTML='';
  const chat=activeChat();
  if(!chat||!chat.messages.length){
    const e=document.createElement('div');e.className='empty';
    const ic=document.createElement('div');ic.className='emptyIcon';ic.innerHTML=svg(ICONS.bot);
    const ti=document.createElement('div');ti.className='emptyTitle';ti.textContent='ChattyLAN';
    const tx=document.createElement('div');
    tx.textContent=settings.baseUrl
      ?(serverMode?'Ask anything \u2014 history is saved on the server.':'Ask anything \u2014 history is saved locally.')
      :'Open the settings, enter your server URL (LM Studio / llama.cpp / Unsloth Studio), pick a model, and start chatting.';
    e.appendChild(ic);e.appendChild(ti);e.appendChild(tx);
    if(settings.baseUrl){
      const chips=document.createElement('div');chips.className='chips';
      for(const s of ['Explain a concept','Write a script','Summarize a text','Help me debug']){
        const ch=document.createElement('button');ch.className='chip';ch.type='button';ch.textContent=s;
        ch.onclick=()=>{const inp=$('#input');inp.value=s+'\u2026';inp.focus();input.dispatchEvent(new Event('input'))};
        chips.appendChild(ch);
      }
      e.appendChild(chips);
    }
    inner.appendChild(e);updateCtxBar();return;
  }
  chat.messages.forEach((m,i)=>inner.appendChild(msgEl(m,i,!streaming&&i===chat.messages.length-1)));
  enhanceCodeBlocks(inner);
  scrollBottom(true);
  updateCtxBar();
}
function nearBottom(){const el=$('#messages');return el.scrollHeight-el.scrollTop-el.clientHeight<140}
function scrollBottom(force){
  const el=$('#messages');
  if(force||nearBottom())el.scrollTop=el.scrollHeight;
  updateScrollBtn();
}
function updateScrollBtn(){
  const el=$('#messages');
  $('#scrollBottomBtn').classList.toggle('show',el.scrollHeight-el.clientHeight-el.scrollTop>240);
}

/* ---------- streaming ---------- */
function setStreamingUI(on){
  const btn=$('#sendBtn');
  if(on){btn.innerHTML=svg(ICONS.stop)+'<span>Stop</span>';btn.classList.add('stop')}
  else{btn.innerHTML=svg(ICONS.send)+'<span>Send</span>';btn.classList.remove('stop')}
  $('#status').classList.toggle('busy',on);
}
function showError(msg){const b=$('#errorBar');b.style.display='block';b.textContent=msg}
function clearError(){$('#errorBar').style.display='none'}

async function send(){
  const text=$('#input').value.trim();
  if(!text||streaming)return;
  if(!normalizeBase(settings.baseUrl)){showError('Enter a server URL first.');return}
  clearError();
  const chat=activeChat()||newChat();
  chat.messages.push({role:'user',content:text});
  if(chat.title==='New chat')chat.title=text.length>42?text.slice(0,42)+'\u2026':text;
  save();renderChatList();
  {const inp=$('#input');inp.value='';inp.style.height='auto';}
  await generate(chat);
}

async function regenerate(){
  if(streaming)return;
  const chat=activeChat();if(!chat)return;
  clearError();
  if(chat.messages.length&&chat.messages[chat.messages.length-1].role==='assistant')chat.messages.pop();
  save();
  await generate(chat);
}

function branchAt(index){
  if(streaming)return;
  const src=activeChat();if(!src||index<1||index>=src.messages.length)return;
  const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    title:src.title+' (branch)',
    messages:src.messages.slice(0,index).map(m=>({role:m.role,content:m.content,reasoning:m.reasoning||'',error:m.error||''}))};
  chats.unshift(c);activeId=c.id;save();renderChatList();renderMessages();
}

async function generate(chat){
  const am={role:'assistant',content:'',reasoning:''};
  chat.messages.push(am);
  renderMessages();
  const sentCount=chat.messages.length-1; // messages actually sent (excl. the empty reply placeholder)

  const last=$('#msgInner').lastElementChild;
  const body=last.querySelector('.mbody');
  const live={contentBox:body.querySelector('.bubble'),details:null,reasoningBox:null};
  live.contentBox.classList.add('typing'); // bouncing dots until the first token arrives
  {
    const det=document.createElement('details');det.className='reasoning streaming';
    const sum=document.createElement('summary');sum.textContent='Reasoning';
    const dots=document.createElement('span');dots.className='rdots';
    for(let k=0;k<3;k++)dots.appendChild(document.createElement('i'));
    sum.appendChild(dots);
    const rt=document.createElement('div');rt.className='rtext';
    det.addEventListener('toggle',()=>{if(det.open)det.classList.remove('streaming')});
    det.appendChild(sum);det.appendChild(rt);
    body.insertBefore(det,body.children[1]);
    live.details=det;live.reasoningBox=rt;
  }

  streaming=true;setStreamingUI(true);aborter=new AbortController();
  // Re-render at most once per animation frame. Running md() over the whole
  // accumulated reply for every SSE chunk is O(n^2) and visibly janks on long
  // answers. Code-block copy bars are added by the final renderMessages() instead.
  let rafId=0;
  const renderStream=()=>{
    if(rafId)return;
    rafId=requestAnimationFrame(()=>{
      rafId=0;
      live.contentBox.innerHTML=md(am.content);
      scrollBottom();
    });
  };
  try{
    const res=await fetch(normalizeBase(settings.baseUrl)+'/chat/completions',{
      method:'POST',signal:aborter.signal,headers:authHeaders(),
      body:JSON.stringify({model:settings.model,messages:buildMessages(chat),stream:true,stream_options:{include_usage:true}})
    });
    if(!res.ok){
      let d='';try{d=(await res.text()).slice(0,300)}catch{}
      throw new Error('HTTP '+res.status+(d?' \u2014 '+d:''));
    }
    const reader=res.body.getReader();
    const dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim();
        buf=buf.slice(i+1);
        if(!line.startsWith('data:'))continue;
        const data=line.slice(5).trim();
        if(data==='[DONE]')continue;
        let j;try{j=JSON.parse(data)}catch{continue}
        if(j.usage){ // real token counts, reported by the server in the final chunk
          chat.lastUsage={prompt:j.usage.prompt_tokens||0,completion:j.usage.completion_tokens||0};
          chat.lastUsageMsgCount=sentCount;
        }
        const delta=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
        if(delta.content){
          if(live.contentBox.classList.contains('typing')){
            live.contentBox.classList.remove('typing');
            live.contentBox.classList.add('stream');
          }
          am.content+=delta.content;
          renderStream();
        }
        const r=delta.reasoning_content!==undefined?delta.reasoning_content:delta.reasoning;
        if(r){
          am.reasoning+=r;
          if(live.details.open)live.reasoningBox.textContent=am.reasoning;
        }
        scrollBottom();
      }
    }
  }catch(e){
    if(e.name==='AbortError'){
      if(!am.content&&!am.reasoning)chat.messages.pop();
    }else{
      // Keep the (empty or partial) reply in history as a red error bubble with
      // a retry button, instead of a dead-end global error bar.
      am.error=(am.content||am.reasoning)?'Stream interrupted: '+e.message:'Request failed: '+e.message;
    }
  }finally{
    streaming=false;setStreamingUI(false);aborter=null;
    if(rafId)cancelAnimationFrame(rafId);
    live.contentBox.classList.remove('typing','stream');
    if(live.details){live.details.classList.remove('streaming');if(!am.reasoning)live.details.remove();else live.details.open=false;}
    // only persist/render if this chat is still the active one — after logout or a chat
    // switch, saving here would write this chat's data into the wrong mode's storage
    if(activeChat()===chat){save();renderMessages()}
    // Some backends (e.g. Unsloth Studio) only report context_length for the model
    // currently loaded in memory — after a request that model is loaded, so re-fetch
    // to pick up its limit (and any newly available models).
    fetchModels();
  }
}

/* ---------- wiring ---------- */
function bind(id,key,after){
  const el=$(id);
  el.value=settings[key]||'';
  el.addEventListener('input',()=>{
    settings[key]=el.value;save();
    if(after)after();
  });
}
bind('#baseUrl','baseUrl',scheduleModels);
// NOTE: the model input is intentionally NOT bound to settings.model — it's a
// filter/display field. Committing on every keystroke would overwrite the
// selected model with partial text and break the context-limit lookup.
// pickModel() (dropdown click / Enter) is the only thing that sets settings.model.
bind('#apiKey','apiKey',scheduleModels);
bind('#sysPrompt','systemPrompt',updateCtxBar);

/* ---------- model dropdown (custom: native datalist won't open when value matches an option) ---------- */
const modelInput=$('#model'),modelDrop=$('#modelDrop');
let modelHl=-1;
// The field is display-only — you pick from the dropdown (click, or arrow keys + Enter).
// No free typing, so settings.model is always a real, valid model id.
modelInput.readOnly=true;
function renderModelDrop(){
  modelDrop.innerHTML='';modelHl=-1;
  if(!models.length){
    const d=document.createElement('div');d.className='modelOpt dim';
    d.textContent='no models available';
    modelDrop.appendChild(d);return;
  }
  for(const m of models){
    const o=document.createElement('div');
    o.className='modelOpt'+(m.id===settings.model?' sel':'');o.dataset.v=m.id;o.textContent=m.ctx?m.id+' \u00B7 '+fmtTok(m.ctx)+' ctx':m.id;
    o.onmousedown=e=>{e.preventDefault();pickModel(m.id)};
    modelDrop.appendChild(o);
  }
}
function openModelDrop(){renderModelDrop();modelDrop.classList.add('open')}
function closeModelDrop(){modelDrop.classList.remove('open');modelHl=-1}
// The only place settings.model is committed. Also syncs the field to the real id.
function pickModel(m){settings.model=m;modelInput.value=m;save();closeModelDrop();updateCtxBar()}
modelInput.addEventListener('focus',openModelDrop);
modelInput.addEventListener('click',()=>{if(!modelDrop.classList.contains('open'))openModelDrop()});
modelInput.addEventListener('keydown',e=>{
  const opts=[...modelDrop.querySelectorAll('.modelOpt[data-v]')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!opts.length)return;
    modelHl=(modelHl+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;
    opts.forEach((o,i)=>o.classList.toggle('hl',i===modelHl));
  }else if(e.key==='Enter'&&modelHl>=0&&opts[modelHl]){
    e.preventDefault();pickModel(opts[modelHl].dataset.v);
  }else if(e.key==='Escape'){
    closeModelDrop();
  }
});
document.addEventListener('click',e=>{if(!e.target.closest('.modelWrap'))closeModelDrop()});

/* ---------- settings modal ---------- */
const settingsPanel=$('#settingsPanel');
function openSettings(){settingsPanel.classList.add('open');$('#baseUrl').focus()}
function closeSettings(){settingsPanel.classList.remove('open')}
$('#settingsBtn').onclick=e=>{e.stopPropagation();settingsPanel.classList.contains('open')?closeSettings():openSettings()};
$('#settingsClose').onclick=closeSettings;
settingsPanel.addEventListener('mousedown',e=>{if(e.target===settingsPanel)closeSettings()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&settingsPanel.classList.contains('open'))closeSettings()});

/* ---------- header depth + scroll-to-bottom ---------- */
const messagesEl=$('#messages');
messagesEl.addEventListener('scroll',()=>{
  document.querySelector('header').classList.toggle('scrolled',messagesEl.scrollTop>4);
  updateScrollBtn();
});
$('#scrollBottomBtn').onclick=()=>scrollBottom(true);

/* ---------- collapsible sidebar / nav ---------- */
function navDefaultOpen(){return !window.matchMedia('(max-width:760px)').matches}
let navOpen=navDefaultOpen();
{
  let stored=null;try{stored=localStorage.getItem(LS.nav)}catch{}
  if(stored!==null)navOpen=(stored==='true');
}
function applyNav(open){
  document.body.classList.toggle('nav-closed',!open);
  const b=$('#navToggle');if(b){b.setAttribute('aria-expanded',String(open));b.title=open?'Hide chat list':'Show chat list'}
}
applyNav(navOpen);
$('#navToggle').onclick=()=>{
  navOpen=!navOpen;
  try{localStorage.setItem(LS.nav,String(navOpen))}catch{}
  applyNav(navOpen);
};
const navMq=window.matchMedia('(max-width:760px)');
if(navMq.addEventListener)navMq.addEventListener('change',()=>{
  let stored=null;try{stored=localStorage.getItem(LS.nav)}catch{}
  if(stored===null){navOpen=navDefaultOpen();applyNav(navOpen)}
});
/* Narrow screens: a tap anywhere in the conversation closes the sidebar, like swiping it away.
   Interactive elements (links, message actions, code copy, composer) are excluded so a tap
   there does its normal job instead. Not persisted — the next reload restores the stored state. */
$('#chatPane').addEventListener('click',e=>{
  if(!navOpen||!navMq.matches)return;
  if(e.target.closest('#composer,#scrollBottomBtn,a,button,summary,input,textarea,select'))return;
  navOpen=false;applyNav(false);
});
/* Status pill: only the traffic light shows; clicking/tapping it reveals the text
   (long status strings would otherwise wrap the header into two rows on phones). */
{const st=$('#status');
const toggleStatusText=()=>{const on=st.classList.toggle('showText');st.setAttribute('aria-expanded',String(on))};
st.onclick=toggleStatusText;
st.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleStatusText()}};}

$('#newChat').onclick=()=>{if(!streaming)newChat()};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];
  if(f)importChat(f);
  e.target.value='';
});
$('#sendBtn').innerHTML=svg(ICONS.send)+'<span>Send</span>';
$('#sendBtn').onclick=()=>{
  if(streaming){aborter&&aborter.abort();return}
  send();
};
const input=$('#input');
// the keyboard hint is desktop-only filler and truncates on narrow screens
const PH_FULL='Send a message\u2026  (Enter to send, Shift+Enter for newline)';
function applyPlaceholder(){input.placeholder=navMq.matches?'Send a message\u2026':PH_FULL}
applyPlaceholder();
if(navMq.addEventListener)navMq.addEventListener('change',applyPlaceholder);
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,240)+'px';
});

/* init */
authForm.addEventListener('submit',e=>{e.preventDefault();doAuth()});
$('#logoutBtn').onclick=()=>logout();
window.addEventListener('beforeunload',()=>{
  // only flush genuinely pending changes — an unconditional beacon on every page close
  // bumps the server rev and can clobber what another device wrote in the meantime
  if(serverMode&&dirty){try{navigator.sendBeacon('api/data',new Blob([JSON.stringify({settings,chats,activeId})],{type:'application/json'}))}catch{}}
});
(async()=>{
  await initAuth();
  bindValues();
  if(!chats.length)newChat();
  else if(!activeChat())activeId=chats[0].id;
  // local mode without a server URL: nudge the user straight into settings — but only
  // when there is no login screen in front of the app (the modal would otherwise sit
  // behind the auth screen and stay open after signing in)
  if(!serverMode&&!settings.baseUrl&&$('#authScreen').style.display==='none')openSettings();
  renderChatList();renderMessages();fetchModels();
})();
</script>
</body>
